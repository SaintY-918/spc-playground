<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPC Playground</title>
<style>
  :root{
    --bg:#f7f7f5; --panel:#ffffff; --ink:#1c1c1a; --muted:#6b6b66; --line:#e2e1dc;
    --accent:#2f6f5e; --accent-soft:#e7f0ec; --danger:#c03a2b; --warn:#c78a1e;
    --zoneA:rgba(192,58,43,.10); --zoneB:rgba(199,138,30,.10); --zoneC:rgba(47,111,94,.08);
    --trace:#3a3a37; --bar:#b9c9c2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16171a; --panel:#1e2024; --ink:#e9e8e4; --muted:#9a9a93; --line:#32343a;
      --accent:#6fbfa4; --accent-soft:#1d2c28; --danger:#e8705f; --warn:#e0ae53;
      --zoneA:rgba(232,112,95,.12); --zoneB:rgba(224,174,83,.12); --zoneC:rgba(111,191,164,.10);
      --trace:#c9c8c3; --bar:#3c5851;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16171a; --panel:#1e2024; --ink:#e9e8e4; --muted:#9a9a93; --line:#32343a;
    --accent:#6fbfa4; --accent-soft:#1d2c28; --danger:#e8705f; --warn:#e0ae53;
    --zoneA:rgba(232,112,95,.12); --zoneB:rgba(224,174,83,.12); --zoneC:rgba(111,191,164,.10);
    --trace:#c9c8c3; --bar:#3c5851;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .muted{color:var(--muted)} .warn{color:var(--warn)}

  .topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
  header h1{font-size:27px;margin:0 0 6px;letter-spacing:-.015em;font-weight:700;text-wrap:balance}
  header p.tag{margin:0;color:var(--muted);max-width:68ch}
  .ainote{margin:14px 0 0;padding:10px 14px;border:1px dashed var(--line);border-radius:9px;
    font-size:12.5px;color:var(--muted);max-width:80ch}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:20px 0}
  .card h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
  .card h2 .num{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;
    font-size:12px;display:grid;place-items:center;flex:none;font-weight:600}
  .card p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
  .card p.sub.spaced{margin:16px 0 0}
  .card h3.sh{font-size:14px;margin:22px 0 6px;padding-top:16px;border-top:1px solid var(--line)}
  .lead{background:var(--accent-soft);border-left:3px solid var(--accent);
    padding:12px 16px;border-radius:0 8px 8px 0;margin:14px 0}
  .lead p{margin:0 0 10px} .lead p.last,.lead p:last-child{margin-bottom:0}
  .lead b{color:var(--accent)}

  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px}
  .ctl label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .ctl label b{color:var(--ink);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select,button{font:inherit;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
  button:hover,select:hover{border-color:var(--accent)}
  .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:14px}
  .chk{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;cursor:pointer;max-width:46ch}
  .chk input{accent-color:var(--accent);margin-top:4px;flex:none}

  .chartbox,.tablebox{overflow-x:auto}
  .chartbox{margin:6px 0}
  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;margin:16px 0 4px;
    padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend i.sw{width:22px;height:0;flex:none;border-top:2px solid transparent}
  .legend i.sw.ucl{border-top-color:var(--danger)}
  .legend i.sw.cl{border-top:2px dashed var(--accent)}
  .legend i.sw.zone{height:11px;border:0;border-radius:2px;
    background:linear-gradient(var(--zoneA),var(--zoneB),var(--zoneC))}
  .legend i.sw.dot{width:9px;height:9px;border:0;border-radius:50%;background:var(--trace)}
  .legend i.sw.baddot{width:11px;height:11px;border:0;border-radius:50%;background:var(--danger)}
  .legend i.sw.bell{height:11px;border:0;border-left:2px solid var(--accent);
    border-bottom:2px solid var(--accent);border-radius:0 0 0 9px}

  svg.cc{width:100%;height:auto;min-width:640px;display:block}
  .zoneA{fill:var(--zoneA)} .zoneB{fill:var(--zoneB)} .zoneC{fill:var(--zoneC)}
  .zoneLetter{fill:var(--muted);font-size:10px;opacity:.7}
  .ucl{stroke:var(--danger);stroke-width:1.4}
  .cl{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4}
  .spec{stroke:var(--ink);stroke-width:1.6}
  .target{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
  .ucl-t{fill:var(--danger)} .cl-t{fill:var(--accent)}
  .limitLabel,.specLabel{font-size:11px;font-variant-numeric:tabular-nums}
  .specLabel{fill:var(--ink)}
  .trace{fill:none;stroke:var(--trace);stroke-width:1.3;opacity:.75}
  .pt{fill:var(--trace);cursor:pointer}
  .pt.bad{fill:var(--danger);stroke:var(--panel);stroke-width:1.5}
  .ruleTag{fill:var(--danger);font-size:10.5px;text-anchor:middle;font-weight:700}
  .axis{stroke:var(--line)} .tick{fill:var(--muted);font-size:10px;text-anchor:middle}
  .chartTitle{fill:var(--ink);font-size:12.5px;font-weight:600}
  .bell{fill:none;stroke:var(--accent);stroke-width:1.5}
  .bellAxis{stroke:var(--line)} .bellTick{stroke:var(--muted)}
  .bellLabel,.bellTitle{fill:var(--muted);font-size:10px}
  .bar{fill:var(--bar)}
  .oos{fill:var(--danger);opacity:.07}

  pre.formula{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    font:12.5px/1.9 "IBM Plex Mono",ui-monospace,Consolas,monospace;overflow-x:auto;margin:12px 0 0}
  .rules{display:grid;gap:8px;margin-top:14px}
  .rule{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;
    padding:10px 12px;border:1px solid var(--line);border-radius:9px}
  .rule.hit{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 6%,transparent)}
  .rule .nm{font-size:13.5px;font-weight:600}
  .rule .dt{font-size:12.5px;color:var(--muted);margin-top:2px}
  .rule .etch{font-size:12.5px;color:var(--accent);margin-top:3px}
  .badge{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--danger);white-space:nowrap;
    border:1px solid var(--danger);border-radius:20px;padding:1px 9px;align-self:center}
  .badge.zero{color:var(--muted);border-color:var(--line)}

  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:16px}
  .gal .en{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .gal h3{font-size:14px;margin:0 0 2px}
  .gal .mn{border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:8px 0 7px;overflow:hidden}
  .gal svg.mini{width:100%;height:96px;display:block}
  .gal .d{font-size:12.5px;color:var(--muted)}
  .gal .d b{color:var(--ink)}

  .story{border:1px dashed var(--line);border-radius:9px;padding:14px 16px;margin-top:14px;font-size:14px}
  .story .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .story p{margin:4px 0 12px}
  .story p:last-child{margin-bottom:0}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
  .stat{border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .stat .v{font:500 25px/1.2 "IBM Plex Mono",ui-monospace,Consolas,monospace;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat .l{font-size:12px;color:var(--muted)}
  .stat.good .v{color:var(--accent)} .stat.bad .v{color:var(--danger)} .stat.warn .v{color:var(--warn)}

  table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:10px;min-width:520px}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12.5px}
  code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    font:12.5px "IBM Plex Mono",ui-monospace,Consolas,monospace}
  details{border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-top:10px}
  details summary{cursor:pointer;font-weight:600;font-size:14px}
  details p{color:var(--muted);font-size:13.5px;margin:8px 0 0}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:36px}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<div class="wrap">

<div class="topbar"><button id="lang" type="button"></button></div>

<header>
  <h1 data-i18n="ui.title"></h1>
  <p class="tag" data-i18n="ui.tagline"></p>
  <p class="ainote" data-i18n="ui.aiNote"></p>
</header>

<!-- 1. 目的與觀念橋接 -->
<section class="card">
  <h2><span class="num">1</span><span data-i18n="s1.title"></span></h2>
  <div data-i18n="s1.body"></div>
</section>

<!-- 2. 模擬器 -->
<section class="card">
  <h2><span class="num">2</span><span data-i18n="s2.title"></span></h2>
  <p class="sub" data-i18n="s2.sub"></p>

  <div class="controls">
    <div class="ctl">
      <label for="scenario" data-i18n="ui.scenario"></label>
      <select id="scenario" style="width:100%"></select>
    </div>
    <div class="ctl">
      <label for="n"><span data-i18n="ui.n"></span> = <b id="nv"></b></label>
      <input type="range" id="n" min="1" max="10" step="1" value="5">
    </div>
    <div class="ctl">
      <label for="groups"><span data-i18n="ui.groups"></span> = <b id="groupsv"></b></label>
      <input type="range" id="groups" min="20" max="60" step="1" value="30">
    </div>
    <div class="ctl">
      <label for="sigma"><span data-i18n="ui.sigma"></span> = <b id="sigmav"></b> <span data-i18n="ui.sigmaUnit"></span></label>
      <input type="range" id="sigma" min="0.3" max="3" step="0.1" value="1">
    </div>
  </div>

  <div class="row">
    <button id="reroll" type="button" data-i18n="ui.reroll"></button>
    <label class="chk"><input type="checkbox" id="bell" checked><span data-i18n="ui.showBell"></span></label>
    <label class="chk"><input type="checkbox" id="letters" checked><span data-i18n="ui.showLetters"></span></label>
    <label class="chk"><input type="checkbox" id="frozen">
      <span><span data-i18n="ui.freeze"></span><br>
        <span class="muted" style="font-size:12px" data-i18n="ui.freezeHint"></span></span></label>
  </div>

  <div class="legend">
    <span><i class="sw ucl"></i><span data-i18n="ui.legend.ucl"></span></span>
    <span><i class="sw cl"></i><span data-i18n="ui.legend.cl"></span></span>
    <span><i class="sw zone"></i><span data-i18n="ui.legend.zone"></span></span>
    <span><i class="sw dot"></i><span data-i18n="ui.legend.dot"></span></span>
    <span><i class="sw baddot"></i><span data-i18n="ui.legend.bad"></span></span>
    <span><i class="sw bell"></i><span data-i18n="ui.legend.bell"></span></span>
    <span class="muted" data-i18n="ui.legend.hover"></span>
  </div>

  <div class="chartbox"><div id="chart1"></div></div>
  <div class="chartbox"><div id="chart2"></div></div>
  <p class="sub spaced" data-i18n="ui.chart.note"></p>

  <details open>
    <summary data-i18n="ui.formulaSummary"></summary>
    <p data-i18n="ui.formulaBody"></p>
    <pre class="formula" id="formula"></pre>
  </details>
</section>

<!-- 3. 型態圖鑑 -->
<section class="card">
  <h2><span class="num">3</span><span data-i18n="s3.title"></span></h2>
  <p class="sub" data-i18n="s3.sub"></p>
  <div class="gallery" id="gallery"></div>
  <div data-i18n="s3.after"></div>
</section>

<!-- 4. 判異規則 -->
<section class="card">
  <h2><span class="num">4</span><span data-i18n="s4.title"></span></h2>
  <p class="sub" data-i18n="s4.sub"></p>
  <div class="row" style="margin-top:0">
    <button id="allon" type="button" data-i18n="ui.rules.allOn"></button>
    <button id="only1" type="button" data-i18n="ui.rules.only1"></button>
  </div>
  <div class="rules" id="rules"></div>
</section>

<!-- 5. 情境說明 -->
<section class="card">
  <h2><span class="num">5</span><span data-i18n="s5.title"></span></h2>
  <p class="sub" data-i18n="s5.sub"></p>
  <div class="story" id="story"></div>
</section>

<!-- 6. 製程能力 -->
<section class="card">
  <h2><span class="num">6</span><span data-i18n="s6.title"></span></h2>
  <p class="sub" data-i18n="s6.sub"></p>
  <div data-i18n="s6.analogy"></div>

  <div class="controls">
    <div class="ctl">
      <label for="spec"><span data-i18n="ui.cap.spec"></span> = <b id="specv"></b></label>
      <input type="range" id="spec" min="1" max="10" step="0.1" value="4">
    </div>
    <div class="ctl">
      <label for="shift"><span data-i18n="ui.cap.shift"></span> = <b id="shiftv"></b></label>
      <input type="range" id="shift" min="-4" max="4" step="0.1" value="0">
    </div>
  </div>

  <div class="chartbox"><div id="hist"></div></div>
  <div class="stats" id="capstats"></div>
  <p id="verdict" style="font-size:14px;margin:0"></p>
  <div data-i18n="s6.table"></div>
</section>

<!-- 7. 規格從哪來 -->
<section class="card">
  <h2><span class="num">7</span><span data-i18n="s7.title"></span></h2>
  <div data-i18n="s7.body"></div>
</section>

<!-- 8. 常見追問 -->
<section class="card">
  <h2><span class="num">8</span><span data-i18n="s8.title"></span></h2>
  <div data-i18n="s8.body"></div>
</section>

<footer data-i18n="ui.footer"></footer>
</div>

<script src="src/i18n.js"></script>
<script src="src/spc.js"></script>
<script src="src/scenarios.js"></script>
<script src="src/chart.js"></script>
<script src="src/app.js"></script>
</body>
</html>
